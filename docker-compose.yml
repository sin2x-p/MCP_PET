version: '3.8'

services:
  # 宠物识别
  mcp-pet:
    build: .
    environment:
      - LOG_LEVEL=INFO
      - MCP_CONFIG=pet
      - MCP_MODE=http
      - TOKEN_SOURCE=header
    ports:
      - "8001:8000"

  # 鸟类识别
  mcp-bird:
    build: .
    environment:
      - LOG_LEVEL=INFO
      - MCP_CONFIG=bird
      - MCP_MODE=http
      - TOKEN_SOURCE=header
    ports:
      - "8002:8000"

  # 通用能力
  mcp-general:
    build: .
    environment:
      - LOG_LEVEL=INFO
      - MCP_CONFIG=general
      - MCP_MODE=http
      - TOKEN_SOURCE=header
    ports:
      - "8003:8000"

  # 证件识别
  mcp-certificate:
    build: .
    environment:
      - LOG_LEVEL=INFO
      - MCP_CONFIG=certificate
      - MCP_MODE=http
      - TOKEN_SOURCE=header
    ports:
      - "8004:8000"

  # 医疗票据
  mcp-invoice-medical:
    build: .
    environment:
      - LOG_LEVEL=INFO
      - MCP_CONFIG=invoice_medical
      - MCP_MODE=http
      - TOKEN_SOURCE=header
    ports:
      - "8005:8000"

  # 财务发票
  mcp-invoice-financial:
    build: .
    environment:
      - LOG_LEVEL=INFO
      - MCP_CONFIG=invoice_financial
      - MCP_MODE=http
      - TOKEN_SOURCE=header
    ports:
      - "8006:8000"

  # 税务发票
  mcp-invoice-tax:
    build: .
    environment:
      - LOG_LEVEL=INFO
      - MCP_CONFIG=invoice_tax
      - MCP_MODE=http
      - TOKEN_SOURCE=header
    ports:
      - "8007:8000"

  # 车辆识别
  mcp-vehicle:
    build: .
    environment:
      - LOG_LEVEL=INFO
      - MCP_CONFIG=vehicle
      - MCP_MODE=http
      - TOKEN_SOURCE=header
    ports:
      - "8008:8000"
