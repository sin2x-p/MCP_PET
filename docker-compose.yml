version: '3.8'

services:
  # 宠物识别
  mcp-pet:
    build: .
    environment:
      - API_BASE=https://ai.inspirvision.cn/s
      - LOG_LEVEL=INFO
    ports:
      - "8001:8000"
    command: ["pet", "http", "--token-source=header"]

  # 鸟类识别
  mcp-bird:
    build: .
    environment:
      - API_BASE=https://ai.inspirvision.cn/s
      - LOG_LEVEL=INFO
    ports:
      - "8002:8000"
    command: ["bird", "http", "--token-source=header"]

  # 通用能力
  mcp-general:
    build: .
