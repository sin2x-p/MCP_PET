services:
  nginx:
    image: nginx
    volumes:
    - ./nginx.conf:/etc/nginx/nginx.conf
    ports:
    - 8000:80
    depends_on:
    - bird_animal
    - bird_detect
    - bird_domestic
    - bird_europe
    - bird_global
    - bird_knowledge
    - bird_north_america
    - certificate
    - general
    - insurance
    - invoice_financial
    - invoice_tax
    - medical_check
    - medical_classify
    - medical_inspection
    - medical_invoice
    - medical_knowledge
    - medical_listing
    - medical_record
    - pet_act
    - pet_archives
    - pet_breed
    - pet_detect
    - pet_face
    - pet_leash
    - pet_limb
    - test
    - test2
    - vehicle
  bird_animal:
    image: biz-mcp-gateway
    environment:
    - MCP_CONFIG=bird_animal
    - TOKEN_SOURCE=header
    volumes:
    - E:\code\mcp\configs:/app/configs:ro
  bird_detect:
