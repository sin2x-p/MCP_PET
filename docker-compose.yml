services:
  nginx:
    image: nginx
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    ports:
      - "8000:80"
    depends_on:
      - pet_breed
      - pet_act
      - pet_archives
      - pet_face
      - pet_detect
      - pet_limb
      - pet_leash
      - bird_detect
      - bird_global
      - bird_domestic
      - bird_north_america
      - bird_europe
      - bird_knowledge
      - bird_animal
      - insurance
      - medical_listing
      - medical_record
      - medical_classify
      - medical_inspection
      - medical_invoice
      - medical_knowledge
      - medical_check
      - general
      - certificate
      - invoice_financial
      - invoice_tax
      - vehicle

  # 宠物识别
  pet_breed:
    image: biz-mcp-gateway
    environment:
      - MCP_CONFIG=pet_breed
      - TOKEN_SOURCE=header
  pet_act:
    image: biz-mcp-gateway
    environment:
      - MCP_CONFIG=pet_act
      - TOKEN_SOURCE=header
  pet_archives:
