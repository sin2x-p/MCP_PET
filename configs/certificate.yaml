metadata:
  name: certificate
  version: 1.0.0
  description: 证件识别
server:
  api_base: ${API_BASE}
  timeout: 30
tools:
- name: identity_card
  description: 身份证识别
  category: 证件识别
  http:
    method: POST
    path: /api/ocr/identityCard
    content_type: form-data
  parameters:
  - python_name: img_base64
    http_field: imgBase64
    type: string
    required: false
    default: ''
    description: 图片base64编码(含data:image/png;base64,)
    location: body
  - python_name: img_url
    http_field: imgUrl
    type: string
    required: false
    default: ''
    description: 图片URL地址
  - python_name: crop_type
    http_field: cropType
    type: integer
    required: false
    default: 0
    description: 0=实拍图 1=复印件
    location: body
  - python_name: detect_quality
    http_field: detectQuality
    type: integer
    required: false
    default: 0
    description: 是否开启质量检测（0关闭 1开启）
    location: body
  - python_name: detect_risk
    http_field: detectRisk
    type: integer
    required: false
    default: 0
    description: 是否开启风险检测（0关闭 1开启）
    location: body
- name: business_license
  description: 营业执照识别
