    required: false
    default: ''
    description: 图片URL地址
- name: bird_type
  description: 鸟类识别
  category: 宠物识别
  http:
    method: POST
    path: /api/birdType
    content_type: form-data
  parameters:
  - python_name: img_base64
    http_field: imgBase64
    type: string
    required: false
