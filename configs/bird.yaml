metadata:
  name: bird
  version: 1.0.0
  description: 鸟类识别
server:
  api_base: ${API_BASE}
  timeout: 30
tools:
- name: get_animal_type
  description: 动物识别
  category: 宠物识别
  http:
    method: POST
    path: /api/getAnimalType
    content_type: form-data
  parameters:
  - python_name: img_base64
    http_field: imgBase64
    type: string
    required: false
    default: ''
    description: 图片base64编码(包含data:image/png;base64,)
    location: body
  - python_name: img_url
    http_field: imgUrl
    type: string
    required: false
    default: ''
    description: 图片URL地址
- name: bird_detect
  description: 鸟类检测
  category: 宠物识别
  http:
    method: POST
    path: /api/birdDetect
    content_type: form-data
  parameters:
  - python_name: img_base64
    http_field: imgBase64
