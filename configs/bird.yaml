- name: bird_europe
  description: 欧洲鸟类分类
  category: 宠物识别
  http:
    method: POST
    path: /api/birdEurope
    content_type: form-data
  parameters:
  - python_name: img_base64
    http_field: imgBase64
    type: string
    required: false
    default: ''
