    location: body
- name: delete_pet_image
  description: 删除宠物档案图片
  category: 宠物识别
  http:
    method: POST
    path: /api/deletePetImageByImageId
    content_type: json
  parameters:
  - python_name: pet_id
    http_field: petId
    type: string
    required: true
    default: ''
    description: 宠物档案ID（必填）
    location: body
  - python_name: img_index
    http_field: imgIndex
    type: string
    required: true
    default: ''
    description: 图片编号，传-1删除整个petId（必填）
    location: body
  - python_name: group_id
    http_field: groupId
    type: string
    required: true
    default: ''
    description: 组ID（必填）
    location: body
  - python_name: mode
    http_field: mode
    type: integer
    required: false
    default: 0
    description: 拍摄模式 0 横屏(默认) 1 夜间
    location: body
- name: pet_event
  description: 宠物事件（确认或回滚档案创建）
  category: 宠物识别
  http:
    method: POST
    path: /api/petEvent
    content_type: json
  parameters:
  - python_name: pet_id
    http_field: petId
    type: string
    required: true
    default: ''
    description: 宠物档案ID（必填）
    location: body
  - python_name: event_type
    http_field: eventType
    type: string
    required: true
    default: ''
    description: 事件类型，rollback 或 commit（必填）
    location: body
  - python_name: pet_type
    http_field: petType
    type: integer
    required: false
    default: 0
    description: 宠物类型：0为狗 1为猫
    location: body
  - python_name: group_id
    http_field: groupId
    type: string
    required: false
    default: ''
    description: 组ID，为空系统自动分配
    location: body
  - python_name: mode
    http_field: mode
    type: integer
    required: false
    default: 0
    description: 拍摄模式 0 横屏(默认) 1 夜间
    location: body
- name: get_pet_archives_list
  description: 档案列表筛选
  category: 宠物识别
