  - python_name: group_id
    http_field: groupId
    type: string
    required: false
    default: ''
    description: 组ID，为空系统自动分配
    location: body
- name: upload_pet_image_find_pet_id
  description: 1:N 搜索匹配（上传图片在库中搜索最相似的宠物）
  category: 宠物识别
  http:
    method: POST
    path: /api/uploadPetImageFindPeytId
    content_type: form-data
  parameters:
  - python_name: img_base64
    http_field: imageBase64
    type: string
    required: false
    default: ''
    description: 图片base64编码，和图片地址必须传一个
    location: body
  - python_name: image_url
    http_field: imageUrl
    type: string
    required: false
    default: ''
    description: 图片URL地址，和图片base64编码必须传一个
  - python_name: group_id
    http_field: groupId
    type: string
    required: false
    default: ''
    description: 组ID，为空查全部，固定值all查全部
    location: body
  - python_name: pet_type
    http_field: petType
    type: integer
    required: false
    default: 0
    description: 宠物类别：0为狗 1为猫（必填）
    location: body
  - python_name: recog_type
    http_field: recogType
    type: integer
    required: false
    default: 0
    description: 识别种类：0为鼻纹 1为脸部（必填）
    location: body
  - python_name: top_k
    http_field: topK
    type: integer
    required: false
    default: 1
    description: 最大返回结果数，默认1
    location: body
