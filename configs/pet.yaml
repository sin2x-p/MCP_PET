  - python_name: page_num
    http_field: pageNum
    type: integer
    required: false
    default: 1
    description: 页码，默认第一页
    location: body
  - python_name: page_size
    http_field: pageSize
    type: integer
    required: false
    default: 10
    description: 每页数量，默认10，最大100
    location: body
