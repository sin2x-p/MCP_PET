  - python_name: pet_id
    http_field: petId
    type: string
    required: false
    default: ''
    description: 宠物档案ID
    location: body
  - python_name: pet_type
    http_field: petType
    type: integer
    required: false
    default: 0
    description: 宠物类别，0狗 1猫
