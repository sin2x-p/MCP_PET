metadata:
  name: pet
  version: 1.0.0
  description: 宠物识别
server:
  api_base: ${API_BASE}
  timeout: 30
tools:
- name: pet_type
  description: 宠物品种识别（识别猫/狗品种）
  category: 宠物识别
  http:
    method: POST
    path: /api/petType
    content_type: form-data
  parameters:
  - python_name: img_base64
    http_field: imageBase64
    type: string
    required: false
    default: ''
    description: 图片base64编码，和图片地址必须传一个
    location: body
  - python_name: image_url
    http_field: imageUrl
    type: string
    required: false
    default: ''
    description: 图片URL地址，和图片base64编码必须传一个
  - python_name: pet_type
    http_field: petType
    type: integer
    required: false
    default: 0
    description: 宠物类别：0为狗 1为猫
    location: body
  - python_name: top_k
    http_field: topK
    type: integer
    required: false
    default: 3
    description: 返回前K个品种，默认3，最大10
    location: body
- name: pet_act
  description: 宠物行为识别
  category: 宠物识别
  http:
    method: POST
    path: /api/things/petAct
    content_type: form-data
  parameters:
  - python_name: img_base64
    http_field: imageBase64
    type: string
    required: false
    default: ''
    description: 图片base64编码(不能带data:image/png;base64头)，和图片地址必须传一个
    location: body
  - python_name: image_url
    http_field: imageUrl
    type: string
    required: false
    default: ''
    description: 图片URL地址，和图片base64编码必须传一个
  - python_name: recognition_types
    http_field: recognitionTypes
    type: integer
    required: false
    default: 0
    description: 识别类型，可多传，0=全部识别，默认0
    location: body
- name: create_pet_archives
  description: 宠物鼻纹+脸创建档案
  category: 宠物识别
  http:
    method: POST
    path: /api/createPetArchives
    content_type: form-data
  parameters:
  - python_name: img_base64
    http_field: imageBase64
    type: string
    required: false
    default: ''
    description: 图片base64编码，和图片地址必须传一个
    location: body
  - python_name: image_url
    http_field: imageUrl
    type: string
    required: false
    default: ''
    description: 图片URL地址，和图片base64编码必须传一个
  - python_name: pet_id
    http_field: petId
    type: string
    required: false
    default: ''
    description: 宠物档案ID，新建时不传；已有档案追加图片时传入
    location: body
  - python_name: mode
    http_field: mode
    type: integer
    required: false
    default: 0
    description: 拍摄模式，0 横屏(默认) 1 夜间
    location: body
  - python_name: group_id
    http_field: groupId
    type: string
    required: false
    default: ''
    description: 组ID，最长64字符，为空系统自动分配
    location: body
  - python_name: recog_type
    http_field: recogType
    type: integer
    required: false
    default: 0
    description: 识别种类：0鼻纹(默认) 1脸部
    location: body
  - python_name: compare_level
    http_field: compareLevel
    type: integer
    required: false
    default: 2
    description: 比对精细度 1(非常精细) 2(比较精细 默认) 3(比较宽松) 4(非常宽松)
    location: body
  - python_name: mark
    http_field: mark
    type: string
    required: false
    default: ''
    description: 备注信息，最多265字符
    location: body
  - python_name: nickname
    http_field: nickname
    type: string
    required: false
    default: ''
    description: 宠物昵称，最多32字符
    location: body
  - python_name: gender
    http_field: gender
    type: integer
    required: false
    default: 0
    description: 性别 0为公 1为母
    location: body
  - python_name: date_of_birth
    http_field: dateOfBirth
    type: string
    required: false
    default: ''
    description: 出生日期，yyyy-MM-dd格式
    location: body
  - python_name: birth_control_status
    http_field: birthControlStatus
    type: integer
    required: false
    default: 0
    description: 绝育状态 0为未 1为已
    location: body
  - python_name: is_verification
    http_field: isVerification
    type: integer
    required: false
    default: 1
    description: 是否开启唯一性校验 0不校验 1校验(默认)
    location: body
