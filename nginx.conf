events {
    worker_connections 1024;
}

http {
    # 宠物识别
    upstream pet_breed { server pet_breed:8000; }
    upstream pet_act { server pet_act:8000; }
    upstream pet_archives { server pet_archives:8000; }
    upstream pet_face { server pet_face:8000; }
    upstream pet_detect { server pet_detect:8000; }
    upstream pet_limb { server pet_limb:8000; }
    upstream pet_leash { server pet_leash:8000; }

    # 鸟类识别
    upstream bird_detect { server bird_detect:8000; }
    upstream bird_global { server bird_global:8000; }
    upstream bird_domestic { server bird_domestic:8000; }
    upstream bird_north_america { server bird_north_america:8000; }
    upstream bird_europe { server bird_europe:8000; }
    upstream bird_knowledge { server bird_knowledge:8000; }
    upstream bird_animal { server bird_animal:8000; }

    # 保险识别
    upstream insurance { server insurance:8000; }

    # 医疗识别
    upstream medical_listing { server medical_listing:8000; }
    upstream medical_record { server medical_record:8000; }
    upstream medical_classify { server medical_classify:8000; }
    upstream medical_inspection { server medical_inspection:8000; }
    upstream medical_invoice { server medical_invoice:8000; }
    upstream medical_knowledge { server medical_knowledge:8000; }
    upstream medical_check { server medical_check:8000; }

    # 通用能力
    upstream general { server general:8000; }

    # 证件识别
    upstream certificate { server certificate:8000; }

    # 财务发票
    upstream invoice_financial { server invoice_financial:8000; }

    # 税务发票
    upstream invoice_tax { server invoice_tax:8000; }

    # 车辆识别
    upstream vehicle { server vehicle:8000; }

    server {
        listen 80;

        # 宠物识别
        location = /mcp/pet/breed { proxy_pass http://pet_breed/mcp; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; }
        location = /mcp/pet/act { proxy_pass http://pet_act/mcp; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; }
        location = /mcp/pet/archives { proxy_pass http://pet_archives/mcp; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; }
        location = /mcp/pet/face { proxy_pass http://pet_face/mcp; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; }
        location = /mcp/pet/detect { proxy_pass http://pet_detect/mcp; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; }
        location = /mcp/pet/limb { proxy_pass http://pet_limb/mcp; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; }
        location = /mcp/pet/leash { proxy_pass http://pet_leash/mcp; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; }

        # 鸟类识别
        location = /mcp/bird/detect { proxy_pass http://bird_detect/mcp; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; }
        location = /mcp/bird/global { proxy_pass http://bird_global/mcp; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; }
        location = /mcp/bird/domestic { proxy_pass http://bird_domestic/mcp; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; }
        location = /mcp/bird/north-america { proxy_pass http://bird_north_america/mcp; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; }
        location = /mcp/bird/europe { proxy_pass http://bird_europe/mcp; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; }
        location = /mcp/bird/knowledge { proxy_pass http://bird_knowledge/mcp; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; }
        location = /mcp/bird/animal { proxy_pass http://bird_animal/mcp; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; }

        # 保险识别
        location = /mcp/insurance { proxy_pass http://insurance/mcp; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; }

        # 医疗识别
        location = /mcp/medical/listing { proxy_pass http://medical_listing/mcp; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; }
        location = /mcp/medical/record { proxy_pass http://medical_record/mcp; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; }
        location = /mcp/medical/classify { proxy_pass http://medical_classify/mcp; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; }
        location = /mcp/medical/inspection { proxy_pass http://medical_inspection/mcp; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; }
        location = /mcp/medical/invoice { proxy_pass http://medical_invoice/mcp; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; }
        location = /mcp/medical/knowledge { proxy_pass http://medical_knowledge/mcp; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; }
        location = /mcp/medical/check { proxy_pass http://medical_check/mcp; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; }

        # 通用能力
        location = /mcp/general { proxy_pass http://general/mcp; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; }

        # 证件识别
        location = /mcp/certificate { proxy_pass http://certificate/mcp; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; }

        # 财务发票
        location = /mcp/invoice/financial { proxy_pass http://invoice_financial/mcp; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; }

        # 税务发票
        location = /mcp/invoice/tax { proxy_pass http://invoice_tax/mcp; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; }

        # 车辆识别
        location = /mcp/vehicle { proxy_pass http://vehicle/mcp; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; }
    }
}
