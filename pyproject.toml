[project]
name = "biz-mcp-gateway"
version = "1.0.4"
description = "OCR/文档识别 MCP 服务，支持医疗票据、证件、车辆、宠物等识别能力"
requires-python = ">=3.10"

dependencies = [
    "fastmcp",
    "httpx",
]

[project.scripts]
biz-mcp-gateway = "biz_mcp_gateway.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/biz_mcp_gateway"]

[tool.hatch.build.targets.wheel.shared-data]
"configs" = "configs"
