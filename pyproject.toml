[project]
name = "biz-mcp-gateway"
version = "1.0.0"
description = "OCR/文档识别 MCP 服务，支持医疗票据、证件、车辆、宠物等识别能力"
requires-python = ">=3.10"
dependencies = [
    "fastmcp",
    "httpx",
]

[project.scripts]
biz-mcp-gateway = "run:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
